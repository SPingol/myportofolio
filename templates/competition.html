{% extends 'base.html' %}
{% block title %}Competitions & Achievements - {{ name }}{% endblock %}

{% block content %}
<section class="experience-section" id="competitions">
  <div class="container">
    <div class="project-header">
      <h1 class="section-title" style="margin-bottom: 0;">Competitions & Achievements</h1>
      {% if user.is_superuser %}
      <button type="button" class="button project-add-button" popovertarget="add-competition-modal">
        <span aria-hidden="true">+</span>
        Add Competition
      </button>
      {% endif %}
    </div>

    <!-- Search Form -->
    <form id="competition-search-form" class="project-search">
      <input type="search" id="search-input" name="q" placeholder="Search by title or organizer"
        class="project-search__input" aria-label="Search by competition title" />
      <button type="submit" class="button">Search</button>
    </form>

    <!-- Dynamic Container -->
    <div id="grid" class="card-grid"></div>

  </div>
</section>

<!-- Modal for Adding Competition -->
{% if user.is_superuser %}
<div id="add-competition-modal" popover class="modal-backdrop">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Add New Competition</h3>
      <button type="button" onclick="closeCompetitionModal()" class="modal-close-btn">&times;</button>
    </div>
    <form id="competition-form">
      {% csrf_token %}
      <div class="form-group">
        <label>Title *</label>
        <input type="text" name="title" required class="project-search__input" />
      </div>
      <div class="form-group">
        <label>Organizer</label>
        <input type="text" name="organizer" class="project-search__input" />
      </div>
      <div class="form-group">
        <label>Award</label>
        <input type="text" name="award" class="project-search__input" />
      </div>
      <div class="form-group">
        <label>Date (e.g. Aug 2023)</label>
        <input type="text" name="date_str" class="project-search__input" />
      </div>
      <div class="form-group">
        <label>Location</label>
        <input type="text" name="location" class="project-search__input" />
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea name="description" rows="3" class="project-search__input"></textarea>
      </div>
      <div class="modal-footer">
        <button type="button" onclick="closeCompetitionModal()" class="button button-secondary">Cancel</button>
        <button type="submit" class="button">Save Competition</button>
      </div>
    </form>
  </div>
</div>
{% endif %}

<script>
  const IS_SUPERUSER = "{{ user.is_superuser|yesno:'true,false' }}" === "true";
  const BASE_COMPETITIONS_ENDPOINT = "/api/competitions/";
  const CREATE_COMPETITION_ENDPOINT = "/competitions/add-ajax/";

  const searchInput = document.getElementById('search-input');
  const searchForm = document.getElementById('competition-search-form');
  const gridContainer = document.getElementById('grid');
  const competitionForm = document.getElementById('competition-form');

  const SEARCH_DEBOUNCE_DELAY = 300;
  let searchDebounceTimer;

  function escapeHtml(value) {
    return String(value ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#39;');
  }

  function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
      const cookies = document.cookie.split(';');
      for (let i = 0; i < cookies.length; i++) {
        const cookie = cookies[i].trim();
        if (cookie.substring(0, name.length + 1) === (name + '=')) {
          cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
          break;
        }
      }
    }
    return cookieValue;
  }

  function closeCompetitionModal() {
    const modal = document.getElementById("add-competition-modal");
    if (modal) modal.hidePopover();
  }

  function buildCompetitionCardElement(item) {
    const fields = item.fields;
    const pk = item.pk;
    const articleElement = document.createElement('article');
    articleElement.className = 'card';

    const title = escapeHtml(fields.title);
    const organizer = escapeHtml(fields.organizer);
    const location = escapeHtml(fields.location);
    const award = escapeHtml(fields.award);
    const dateStr = escapeHtml(fields.date_str);
    const description = escapeHtml(fields.description || '').replace(/\n/g, '<br>');
    const tagsList = fields.tags_list || [];

    const deleteHtml = IS_SUPERUSER
      ? `<form action="/competitions/${pk}/delete/" method="POST" style="display:inline;" onsubmit="return confirm('Delete this competition?')">
          <input type="hidden" name="csrfmiddlewaretoken" value="${getCookie('csrftoken')}">
          <button type="submit" class="button button-danger">Delete</button>
        </form>`
      : '';

    articleElement.innerHTML = `
      <div class="card-header">
        <div>
          ${award ? `<span class="award-badge">${award}</span>` : ''}
          <h3>${title}</h3>
          <p class="card-subtitle">
            ${organizer} ${location ? `· ${location}` : ''}
            ${dateStr ? `<span class="date-tag">• ${dateStr}</span>` : ''}
          </p>
        </div>
      </div>
      <div class="card-body">
        <p>${description}</p>
      </div>
      <div class="card-footer">
        <div class="card-tags">
          ${tagsList.map(tag => `<span class="tech-tag">${escapeHtml(tag)}</span>`).join('')}
        </div>
        <div class="card-actions">
          <form action="/competitions/${pk}/star/" method="POST" style="display:inline;">
            <input type="hidden" name="csrfmiddlewaretoken" value="${getCookie('csrftoken')}">
            <button type="submit" class="button button-small">
              <span style="color: ${fields.is_starred ? '#f59e0b' : '#9ca3af'};">★</span> ${fields.star_count || 0}
            </button>
          </form>
          ${deleteHtml}
        </div>
      </div>
    `;
    return articleElement;
  }

  async function fetchCompetitions(searchQuery = '') {
    gridContainer.innerHTML = `<p class="empty-state">Loading competitions...</p>`;

    try {
      const url = searchQuery ? `${BASE_COMPETITIONS_ENDPOINT}?q=${encodeURIComponent(searchQuery)}` : BASE_COMPETITIONS_ENDPOINT;
      const response = await fetch(url);
      if (!response.ok) throw new Error(`HTTP Error ${response.status}`);
      const data = await response.json();

      if (!data || data.length === 0) {
        gridContainer.innerHTML = `<p class="empty-state">No competitions found.</p>`;
        return;
      }

      gridContainer.innerHTML = '';
      data.forEach(item => gridContainer.appendChild(buildCompetitionCardElement(item)));
    } catch (error) {
      gridContainer.innerHTML = `<p class="form-error">Failed to load competitions.</p>`;
    }
  }

  function searchCompetitions() {
    fetchCompetitions(searchInput.value.trim());
  }

  searchInput.addEventListener('input', () => {
    clearTimeout(searchDebounceTimer);
    searchDebounceTimer = setTimeout(searchCompetitions, SEARCH_DEBOUNCE_DELAY);
  });

  searchForm.addEventListener('submit', (e) => {
    e.preventDefault();
    clearTimeout(searchDebounceTimer);
    searchCompetitions();
  });

  async function addCompetition(event) {
    event.preventDefault();
    const submitBtn = competitionForm.querySelector('button[type="submit"]');
    submitBtn.disabled = true;

    try {
      const response = await fetch(CREATE_COMPETITION_ENDPOINT, {
        method: 'POST',
        headers: { 'X-CSRFToken': getCookie('csrftoken') },
        body: new FormData(competitionForm),
      });

      const data = await response.json().catch(() => ({}));

      if (response.status === 201) {
        competitionForm.reset();
        closeCompetitionModal();
        if (typeof showToast === 'function') showToast("Competition added successfully!", false);
        fetchCompetitions(searchInput.value.trim());
      } else {
        const errorMsg = data.message || 'Validation error saving competition.';
        if (typeof showToast === 'function') showToast(errorMsg, true);
      }
    } catch (err) {
      if (typeof showToast === 'function') showToast("Network error while saving.", true);
    } finally {
      submitBtn.disabled = false;
    }
  }

  if (competitionForm) {
    competitionForm.addEventListener('submit', addCompetition);
  }

  fetchCompetitions(searchInput.value.trim());
</script>
{% endblock %}
