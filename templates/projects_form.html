{% extends "base.html" %}
{% block title %}Add/Edit Project - {{ name }}{% endblock%}
{% block content %}
<section class="experience-section">
  <div class="container">
    <h1>Project Form</h1>
    <form method="post" action="" class="project-form">
      {% csrf_token %}
      {% for field in form %}
      <div class="form-group">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% for error in field.errors %}
        <p class="form-error">{{ error }}</p>
        {% endfor %}
      </div>
      {% endfor %}
      <button type="submit" class="button">Save Project</button>
      <a href="{% url 'main:show_projects' %}" class="button button-secondary">Cancel</a>
    </form>
  </div>
</section>
{% endblock %}
