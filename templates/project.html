{% extends 'base.html' %}
{% block title %}Projects - {{ name }}{% endblock %}

{% block content %}
<section class="experience-section" id="projects">
  <div class="container">
    <div class="project-header">
      <h1 class="section-title" style="margin-bottom: 0;">Projects</h1>
      {% if user.is_superuser %}
      <button type="button" class="button project-add-button" popovertarget="add-project-modal">
        <span aria-hidden="true">+</span>
        Add Project
      </button>
      {% endif %}
    </div>

    <!-- Search Form -->
    <form id="project-search-form" class="project-search">
      <input type="search" id="search-input" name="q" placeholder="Search by title or tech stack"
        class="project-search__input" aria-label="Search by project title" />
      <button type="submit" class="button">Search</button>
    </form>

    <!-- Dynamic Container -->
    <div id="grid" class="card-grid"></div>

  </div>
</section>

<!-- Modal for Adding Project -->
{% if user.is_superuser %}
<div id="add-project-modal" popover class="modal-backdrop">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Add New Project</h3>
      <button type="button" onclick="closeProjectModal()" class="modal-close-btn">&times;</button>
    </div>
    <form id="project-form">
      {% csrf_token %}
      <div class="form-group">
        <label>Title *</label>
        <input type="text" name="title" required class="project-search__input" />
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea name="description" rows="3" class="project-search__input"></textarea>
      </div>
      <div class="form-group">
        <label>Tech Stack</label>
        <input type="text" name="tech_stack" class="project-search__input"
          placeholder="e.g. Python, Django, JavaScript" />
      </div>
      <div class="form-group">
        <label>Link</label>
        <input type="url" name="link" class="project-search__input" />
      </div>
      <div class="modal-footer">
        <button type="button" onclick="closeProjectModal()" class="button button-secondary">Cancel</button>
        <button type="submit" class="button">Save Project</button>
      </div>
    </form>
  </div>
</div>
{% endif %}

<script>
  const IS_SUPERUSER = "{{ user.is_superuser|yesno:'true,false' }}" === "true";
  const BASE_PROJECTS_ENDPOINT = "/api/projects/";
  const CREATE_PROJECT_ENDPOINT = "/projects/add-ajax/";

  const searchInput = document.getElementById('search-input');
  const searchForm = document.getElementById('project-search-form');
  const gridContainer = document.getElementById('grid');
  const projectForm = document.getElementById('project-form');

  const SEARCH_DEBOUNCE_DELAY = 300;
  let searchDebounceTimer;

  function escapeHtml(value) {
    return String(value ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#39;');
  }

  function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
      const cookies = document.cookie.split(';');
      for (let i = 0; i < cookies.length; i++) {
        const cookie = cookies[i].trim();
        if (cookie.substring(0, name.length + 1) === (name + '=')) {
          cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
          break;
        }
      }
    }
    return cookieValue;
  }

  function closeProjectModal() {
    const modal = document.getElementById("add-project-modal");
    if (modal) modal.hidePopover();
  }

  function buildProjectCardElement(item) {
    const fields = item.fields;
    const pk = item.pk;
    const articleElement = document.createElement('article');
    articleElement.className = 'card';

    const title = escapeHtml(fields.title);
    const description = escapeHtml(fields.description || '').replace(/\n/g, '<br>');
    const link = escapeHtml(fields.link);
    const techStack = fields.tech_stack_list || [];

    const deleteHtml = IS_SUPERUSER
      ? `<form action="/projects/${pk}/delete/" method="POST" style="display:inline;" onsubmit="return confirm('Delete this project?')">
          <input type="hidden" name="csrfmiddlewaretoken" value="${getCookie('csrftoken')}">
          <button type="submit" class="button button-danger">Delete</button>
        </form>`
      : '';

    articleElement.innerHTML = `
      <div class="card-header">
        <div>
          <h3>${title}</h3>
        </div>
      </div>
      <div class="card-body">
        <p>${description}</p>
        ${link ? `<p><a href="${link}" target="_blank">View Project &rarr;</a></p>` : ''}
      </div>
      <div class="card-footer">
        <div class="card-tags">
          ${techStack.map(tech => `<span class="tech-tag">${escapeHtml(tech)}</span>`).join('')}
        </div>
        <div class="card-actions">
          <form action="/projects/${pk}/star/" method="POST" style="display:inline;">
            <input type="hidden" name="csrfmiddlewaretoken" value="${getCookie('csrftoken')}">
            <button type="submit" class="button button-small">
              <span style="color: ${fields.is_starred ? '#f59e0b' : '#9ca3af'};">★</span> ${fields.star_count || 0}
            </button>
          </form>
          ${deleteHtml}
        </div>
      </div>
    `;
    return articleElement;
  }

  async function fetchProjects(searchQuery = '') {
    gridContainer.innerHTML = `<p class="empty-state">Loading projects...</p>`;

    try {
      const url = searchQuery ? `${BASE_PROJECTS_ENDPOINT}?q=${encodeURIComponent(searchQuery)}` : BASE_PROJECTS_ENDPOINT;
      const response = await fetch(url);
      if (!response.ok) throw new Error(`HTTP Error ${response.status}`);
      const data = await response.json();

      if (!data || data.length === 0) {
        gridContainer.innerHTML = `<p class="empty-state">No projects found.</p>`;
        return;
      }

      gridContainer.innerHTML = '';
      data.forEach(item => gridContainer.appendChild(buildProjectCardElement(item)));
    } catch (error) {
      gridContainer.innerHTML = `<p class="form-error">Failed to load projects.</p>`;
    }
  }

  function searchProjects() {
    fetchProjects(searchInput.value.trim());
  }

  searchInput.addEventListener('input', () => {
    clearTimeout(searchDebounceTimer);
    searchDebounceTimer = setTimeout(searchProjects, SEARCH_DEBOUNCE_DELAY);
  });

  searchForm.addEventListener('submit', (e) => {
    e.preventDefault();
    clearTimeout(searchDebounceTimer);
    searchProjects();
  });

  async function addProject(event) {
    event.preventDefault();
    const submitBtn = projectForm.querySelector('button[type="submit"]');
    submitBtn.disabled = true;

    try {
      const response = await fetch(CREATE_PROJECT_ENDPOINT, {
        method: 'POST',
        headers: { 'X-CSRFToken': getCookie('csrftoken') },
        body: new FormData(projectForm),
      });

      const data = await response.json().catch(() => ({}));

      if (response.status === 201) {
        projectForm.reset();
        closeProjectModal();
        if (typeof showToast === 'function') showToast("Project added successfully!", false);
        fetchProjects(searchInput.value.trim());
      } else {
        const errorMsg = data.message || 'Validation error saving project.';
        if (typeof showToast === 'function') showToast(errorMsg, true);
      }
    } catch (err) {
      if (typeof showToast === 'function') showToast("Network error while saving.", true);
    } finally {
      submitBtn.disabled = false;
    }
  }

  if (projectForm) {
    projectForm.addEventListener('submit', addProject);
  }

  fetchProjects(searchInput.value.trim());
</script>
{% endblock %}
