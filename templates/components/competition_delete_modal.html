<p class="experience-status">
    <button type="button" class="button button-danger" popovertarget="delete-competition-{{ competition.id }}"
        aria-label="Delete {{ competition.title }}" title="Delete competition">
        Delete Competition
    </button>
</p>

<div id="delete-competition-{{ competition.id }}" class="project-delete-modal" popover="auto" role="dialog"
    aria-modal="true" aria-labelledby="delete-competition-title-{{ competition.id }}">
    <button type="button" class="project-delete-modal__backdrop" popovertarget="delete-competition-{{ competition.id }}"
        popovertargetaction="hide" aria-label="Close delete confirmation"></button>
    <div class="project-delete-modal__content">
        <button type="button" class="project-delete-modal__close"
            popovertarget="delete-competition-{{ competition.id }}" popovertargetaction="hide"
            aria-label="Close delete confirmation">
            ×
        </button>
        <h2 id="delete-competition-title-{{ competition.id }}">Delete Competition?</h2>
        <p>
            Are you sure you want to delete
            <strong>{{ competition.title }}</strong>?
        </p>
        <div class="project-delete-modal__actions">
            <button type="button" class="button button-secondary"
                popovertarget="delete-competition-{{ competition.id }}" popovertargetaction="hide">
                Cancel
            </button>
            <form method="post" action="{% url 'main:delete_competition' competition.id %}">
                {% csrf_token %}
                <button type="submit" class="button button-danger">Yes, Delete</button>
            </form>
        </div>
    </div>
</div>
