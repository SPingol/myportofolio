<p class="experience-status">
    <button type="button" class="button button-danger" popovertarget="delete-{{ item_type }}-{{ item.id }}"
        aria-haspopup="dialog">
        Delete {{ section_name }}
    </button>
</p>

<div id="delete-{{ item_type }}-{{ item.id }}" popover="auto" role="dialog" aria-modal="true"
    aria-labelledby="delete-{{ item_type }}-title-{{ item.id }}" class="modal-container">
    <div class="modal-content">
        <h2 id="delete-{{ item_type }}-title-{{ item.id }}">
            Delete {{ section_name }}
        </h2>
        <p>
            Are you sure you want to delete <strong>"{{ item_title }}"</strong>? This action cannot be undone.
        </p>

        <form method="post" action="{% url delete_url item.id %}">
            {% csrf_token %}
            <div class="modal-actions">
                <button type="button" class="button button-secondary"
                    popovertarget="delete-{{ item_type }}-{{ item.id }}" popovertargetaction="hide">
                    Cancel
                </button>
                <button type="submit" class="button button-danger">
                    Confirm Delete
                </button>
            </div>
        </form>
    </div>
</div>
