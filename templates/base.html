{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Portfolio{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />

    <style>
      .volume-slider {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 4px;
        background: #ff4500;
        border-radius: 2px;
        outline: none;
      }

      .volume-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #ede6d6;
        cursor: pointer;
      }

      .volume-slider::-moz-range-thumb {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #ede6d6;
        cursor: pointer;
        border: none;
      }

      .visualizer-container {
        width: 100%;
        height: 40px;
        display: block;
        margin-top: 15px;
      }

      .visualizer-canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>

    <!-- Block for page-specific CSS -->
    {% block extra_css %}{% endblock %}
  </head>
  <body>
    <!-- Top ornamental scroll bar -->
    <div class="scroll-bar-top"></div>

    <!-- Site Header / Navigation Menu -->
    <header class="site-header">
      <div class="container">
        <a href="{% url 'main:show_main' %}" class="brand">{{ name }}</a>
        <nav>
          <a href="{% url 'main:show_main' %}">Profile</a>
          <a href="{% url 'main:show_experience' %}">Experience</a>
          <a href="{% url 'main:show_competition' %}">Competitions</a>
          <a href="{% url 'main:show_education' %}">Education</a>
        </nav>
      </div>
    </header>

    <!-- Main Content Injection Window -->
    <main>{% block content %}{% endblock %}</main>

    <!-- Site Footer -->
    <footer class="site-footer">
      <div class="container">
        <p>
          &copy; 2026 {{ name }}. Fakultas Ilmu Komputer, Universitas Indonesia.
        </p>
      </div>
    </footer>

    <!-- Bottom ornamental scroll bar -->
    <div class="scroll-bar-bottom"></div>

    <!-- Block for page-specific JavaScript -->
    {% block extra_js %}{% endblock %}
  </body>
</html>
