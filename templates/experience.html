{% extends 'base.html' %}
{% block title %}Experience - {{ name }}{% endblock %}

{% block content %}
<section class="experience-section" id="experience">
  <div class="container">
    <div class="project-header">
      <h1 class="section-title" style="margin-bottom: 0;">Experience</h1>
      {% if user.is_superuser %}
      <button type="button" class="button project-add-button" popovertarget="add-experience-modal">
        <span aria-hidden="true">+</span>
        Add Experience
      </button>
      {% endif %}
    </div>

    <!-- Search Form -->
    <form id="experience-search-form" class="project-search">
      <input type="search" id="search-input" name="q" placeholder="Search by title or role"
        class="project-search__input" aria-label="Search by experience title" />
      <button type="submit" class="button">Search</button>
    </form>

    <!-- Dynamic Container -->
    <div id="grid" class="card-grid"></div>

  </div>
</section>

<!-- Modal for Adding Experience -->
{% if user.is_superuser %}
<div id="add-experience-modal" popover class="modal-backdrop">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Add New Experience</h3>
      <button type="button" onclick="closeExperienceModal()" class="modal-close-btn">&times;</button>
    </div>
    <form id="experience-form">
      {% csrf_token %}
      <div class="form-group">
        <label>Title *</label>
        <input type="text" name="title" required class="project-search__input" />
      </div>
      <div class="form-group">
        <label>Role</label>
        <input type="text" name="role" class="project-search__input" />
      </div>
      <div class="form-group">
        <label>Category</label>
        <input type="text" name="category" class="project-search__input" />
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea name="description" rows="3" class="project-search__input"></textarea>
      </div>
      <div class="modal-footer">
        <button type="button" onclick="closeExperienceModal()" class="button button-secondary">Cancel</button>
        <button type="submit" class="button">Save Experience</button>
      </div>
    </form>
  </div>
</div>
{% endif %}

<script>
  const IS_SUPERUSER = "{{ user.is_superuser|yesno:'true,false' }}" === "true";
  const BASE_EXPERIENCE_ENDPOINT = "/api/experience/";
  const CREATE_EXPERIENCE_ENDPOINT = "/experience/add-ajax/";

  const searchInput = document.getElementById('search-input');
  const searchForm = document.getElementById('experience-search-form');
  const gridContainer = document.getElementById('grid');
  const experienceForm = document.getElementById('experience-form');

  const SEARCH_DEBOUNCE_DELAY = 300;
  let searchDebounceTimer;

  function escapeHtml(value) {
    return String(value ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#39;');
  }

  function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
      const cookies = document.cookie.split(';');
      for (let i = 0; i < cookies.length; i++) {
        const cookie = cookies[i].trim();
        if (cookie.substring(0, name.length + 1) === (name + '=')) {
          cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
          break;
        }
      }
    }
    return cookieValue;
  }

  function closeExperienceModal() {
    const modal = document.getElementById("add-experience-modal");
    if (modal) modal.hidePopover();
  }

  function buildExperienceCardElement(item) {
    const fields = item.fields;
    const pk = item.pk;
    const articleElement = document.createElement('article');
    articleElement.className = 'card';

    const title = escapeHtml(fields.title);
    const role = escapeHtml(fields.role);
    const category = escapeHtml(fields.category);
    const description = escapeHtml(fields.description || '').replace(/\n/g, '<br>');
    const skillsList = fields.skills_list || [];

    const deleteHtml = IS_SUPERUSER
      ? `<form action="/experience/${pk}/delete/" method="POST" style="display:inline;" onsubmit="return confirm('Delete this experience?')">
          <input type="hidden" name="csrfmiddlewaretoken" value="${getCookie('csrftoken')}">
          <button type="submit" class="button button-danger">Delete</button>
        </form>`
      : '';

    articleElement.innerHTML = `
      <div class="card-header">
        <div>
          <h2>${title}</h2>
          ${role ? `<p class="card-subtitle">${role}</p>` : ''}
        </div>
      </div>
      <div class="card-body">
        <p>${description}</p>
      </div>
      <div class="card-footer">
        <div class="card-tags">
          ${category ? `<span class="tech-tag">${category}</span>` : ''}
          ${skillsList.map(skill => `<span class="tech-tag">${escapeHtml(skill)}</span>`).join('')}
        </div>
        <div class="card-actions">
          <form action="/experience/${pk}/star/" method="POST" style="display:inline;">
            <input type="hidden" name="csrfmiddlewaretoken" value="${getCookie('csrftoken')}">
            <button type="submit" class="button button-small">
              <span style="color: ${fields.is_starred ? '#f59e0b' : '#9ca3af'};">★</span> ${fields.star_count || 0}
            </button>
          </form>
          ${deleteHtml}
        </div>
      </div>
    `;
    return articleElement;
  }

  async function fetchExperience(searchQuery = '') {
    gridContainer.innerHTML = `<p class="empty-state">Loading experience entries...</p>`;

    try {
      const url = searchQuery ? `${BASE_EXPERIENCE_ENDPOINT}?q=${encodeURIComponent(searchQuery)}` : BASE_EXPERIENCE_ENDPOINT;
      const response = await fetch(url);
      if (!response.ok) throw new Error(`HTTP Error ${response.status}`);
      const data = await response.json();

      if (!data || data.length === 0) {
        gridContainer.innerHTML = `<p class="empty-state">No experience entries found.</p>`;
        return;
      }

      gridContainer.innerHTML = '';
      data.forEach(item => gridContainer.appendChild(buildExperienceCardElement(item)));
    } catch (error) {
      gridContainer.innerHTML = `<p class="form-error">Failed to load experience entries.</p>`;
    }
  }

  function searchExperience() {
    fetchExperience(searchInput.value.trim());
  }

  searchInput.addEventListener('input', () => {
    clearTimeout(searchDebounceTimer);
    searchDebounceTimer = setTimeout(searchExperience, SEARCH_DEBOUNCE_DELAY);
  });

  searchForm.addEventListener('submit', (e) => {
    e.preventDefault();
    clearTimeout(searchDebounceTimer);
    searchExperience();
  });

  async function addExperience(event) {
    event.preventDefault();
    const submitBtn = experienceForm.querySelector('button[type="submit"]');
    submitBtn.disabled = true;

    try {
      const response = await fetch(CREATE_EXPERIENCE_ENDPOINT, {
        method: 'POST',
        headers: { 'X-CSRFToken': getCookie('csrftoken') },
        body: new FormData(experienceForm),
      });

      const data = await response.json().catch(() => ({}));

      if (response.status === 201) {
        experienceForm.reset();
        closeExperienceModal();
        if (typeof showToast === 'function') showToast("Experience added successfully!", false);
        fetchExperience(searchInput.value.trim());
      } else {
        const errorMsg = data.message || 'Validation error saving experience.';
        if (typeof showToast === 'function') showToast(errorMsg, true);
      }
    } catch (err) {
      if (typeof showToast === 'function') showToast("Network error while saving.", true);
    } finally {
      submitBtn.disabled = false;
    }
  }

  if (experienceForm) {
    experienceForm.addEventListener('submit', addExperience);
  }

  fetchExperience(searchInput.value.trim());
</script>
{% endblock %}
